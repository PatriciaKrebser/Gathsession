<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Gathsession</title>
  </head>

  <body>
    <header class="header">
      <a class="gath" href="#">Gath<span>Session</span>.</a>

      <nav class="navbar">
        <ul>
          <li><a class="active" href="#">Home</a></li>
          <li><a href="#">Features</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="#">About Us</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="hero">
        <section class="title">
          <h1>Build your best community starting from here.</h1>

          <p>
            Meet and communicate with the best people to run projects, events or
            other activities in a more effective and fun way
          </p>

          <div class="title_actions">
            <button type="button">Get Started</button>
            <a href="#">
              Learn More
              <img src="./assets/title/Arrow.svg" alt="" />
            </a>
          </div>
        </section>

        <section class="content">
          <div class="ellipse ellipse-large"></div>
          <div class="ellipse ellipse-small"></div>
          <img
            class="img1"
            src="./assets/content/handsome-serious-calm-guy-with-dark-skin-and-beard.png"
            alt="Man with dark skin and a beard"
          />

          <img
            class="img2"
            src="./assets/content/positive-dark-skinned-woman-dressed-in-domestic.png"
            alt="woman with dark skin"
          />

          <img
            class="img3"
            src="./assets/content/positive-smiling-handsome.png"
            alt="Smiling red-haired woman"
          />

          <img
            class="img4"
            src="./assets/content/pretty-young-asian-woman.png"
            alt="Young Asian woman"
          />

          <img
            class="img5"
            src="./assets/content/vertical-shot-of-young-european-woman-in-glasses.png"
            alt="Young woman wearing glasses"
          />
        </section>
      </div>

      <section class="services">
        <article class="service community">
          <div class="service_icon">
            <img src="./assets/service/Comments.svg" alt="" />
          </div>
          <p>Build Community</p>
        </article>

        <article class="service events">
          <div class="service_icon">
            <img src="./assets/service/Week Schedule.svg" alt="" />
          </div>
          <p>Share Events</p>
        </article>

        <article class="service information">
          <div class="service_icon">
            <img src="./assets/service/Post.svg" alt="" />
          </div>
          <p>Get Information</p>
        </article>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
